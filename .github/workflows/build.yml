name: Build BioThings Studio Webapp

# Builds pull requests like the deploys do, without deploying, so that dependency updates (from
# Dependabot too) show whether the webapp still builds

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
    - run: npm --prefix webapp/ ci
    - run: npm --prefix webapp/ run build
